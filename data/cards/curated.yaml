    ability_description: once a ground troop comes within 3 tiles of the Goblin Cage, they’re dragged into the Cage and the Brawler will hit the troop every 1 second. During this time, the troop is unable to attack and the Goblin Brawler is immune to all forms damage (except Electro Giant's Zap Pack.
Goblin Drill:
  evo:
    cycles: 2
    stat_boost: null
    ability_name: Whack-A-Drill
    ability_description: After the Goblin Drill reaches 66% of its original hitpoints, it'll go back underground and spawn 2 Goblins. Afterwards, it'll emerge 90 degrees around the Crown Tower from where it originally was. After reaching 33% of its original hitpoints, it'll rotate another 90 degrees around the Crown Tower and spawn another Goblin. The spawn damage and pushback upon emerging is done only once (when initially deployed). If it hasn't been placed next to the Crown Tower, it'll emerge in the same spot all 3 times.
