    stat_boost: null
    ability_name: Wind Gush
    ability_description: A burst of wind is created in a 8x9 area, reducing enemies' movement speed by 30% and increasing troops' movement speed by 30%. The wind burst lasts for 5 seconds, but if the Baby Dragon is defeated, it will only last 2.5 seconds.
Balloon:
  hero_ability:
