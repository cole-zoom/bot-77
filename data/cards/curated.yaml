Executioner:
  evo:
    cycles: 1
    stat_boost: null
    ability_name: Axe Smash
    ability_description: The Executioner throws an axe that at 2.5 tiles or less, deals 35% extra damage and knockback, pushing troops back 1.5 tiles. The axe does not deal knockback when returning to the Executioner, and its knockback does not work against heavy units.
Firecracker:
  evo:
    cycles: 2
    stat_boost: null
