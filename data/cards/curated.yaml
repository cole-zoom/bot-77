Goblin Barrel:
  evo:
    cycles: 2
    stat_boost: null
    ability_name: Decoy Barrel
    ability_description: Spawns 2 Goblin Barrels with identical appearances, with the Decoy glowing for 1 second, with the placement mirroring each other in their respective lanes. The Goblin Barrel manually deployed by the player will contain 3 Goblins while the other Goblin Barrel will contain 3 Decoy Goblins. These are identical to Goblins, but they have 53% of a Goblin's damage and 60% of a Goblin's hitpoints.
Goblin Cage:
  evo:
    cycles: 2
    stat_boost: null
