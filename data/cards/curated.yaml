Golden Knight:
  champion_ability:
    name: Dashing Dash
    cost: 1
    description: 'For 1 Elixir, you can use his dashingly dashed Dashing Dash dashability, causing him to run around until he approaches an enemy, instantly dashing through a foe through another for up to 10 times, and delivering mean swings afterwards! On top of everything else, very much like his former associate, the Bandit, he is completely invulnerable to anything while dashing, but will stop once he dashes onto a Crown Tower! Combine that with his constant dashing without a skip, and you get a juggernaut who''s figuratively and literally gold.


      Skeleton King

      SkeletonKingCard

      For 4 Elixir, the almighty dynast of the dead rises through the Arena, clubbing everything through his way with a moderate damage melee splash attack! While he stays in the Arena, any form of life destroyed in the entire battlefield, whether it be friend or foe, will make a fine addition to his Soul Counter, albeit with a limit of 14 souls.


      For 2 Elixir, you can use his Soul Summoning ability right above your hand. It will release all of the souls he kept for battle in form of Skeletons around a royal Graveyard aura around him, and adds in 6 more Skeletons among the skeleton squad! Be a bit cautious, as some splash damage dealers will shrug off his reincarnated henchmen and kill a royal entity not even he could revive.


      Boss Bandit

      BossBanditCard

      The boss of the secret Forest Gang association, and the one on all the wanted posters. For 6 Elixir, the Boss Bandit is far more powerful than the Bandit, with far more dangerous and damaging hits and dashes, while making her harder to take out.


      For 1 Elixir, you can use her Getaway Grenade, which makes her become invisible while teleporting back 6 tiles, making her dash again if her target stays away! The ability has a total of 2 uses (with a 3 second cooldown between each use), building her a great getaway (and grenade) plan!


