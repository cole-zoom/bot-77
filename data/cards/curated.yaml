      IT''S ALI-I-I-I-VE! Doctor Goblinstein is a mad scientist ready to drop in the arena with his mad inventions, such as his trusty Monster, delicately crafted with high health and a vendetta for buildings, although Goblinstein forgot that his creation is a bit vulnerable to tank killers when he’s not in. He holds a remote that shoots some lightning, stunning enemies for a split second, while being safely protected by the green hunky creation of a mastermind. These 2 can attack and/or defend one or two lanes, all for only 5 Elixir!


      For 2 Elixir, you can use his Lightning Link, which is quite shocking for him and the Monster! Goblinstein will link through the monster''s antenna, creating an electrical passage between them, dealing a shocking amount of damage to anything brave enough to stand near the electricity for 3.5 seconds. The Monster will drop an antenna upon defeat, allowing Goblinstein to either continue his ability or start one! But if Goblinstein dies, the ability will stop immediately and become unusable.


      Little Prince

      LittlePrinceCard

      Now who was the irresponsible parent that let their nephew to the Arena? This mischievous brat loads in his crossbow and fires them at all enemies. His crossbow attack ramps up in DPS the longer he stays still, and unlike the Inferno Dragon, he doesn''t stop his crossbow''s ramping up when he destroys an enemy. He does stop if he moves more than an inch, though, making pushback come in handy, as well as stunners.


      For 3 Elixir, you can use his Royal Rescue to meet his guardian: Guardienne, creating the most mischievous tank + glass cannon combo. She dashes her way from behind the kid and on the way to be in front of the Little Prince himself, damaging and knocking back enemies during her dash, and hopefully letting said Little Prince stay a little longer to charge his crossbow. Guardienne will act like a Knight with less health but slightly more damage as long as she stays alive.


      Monk

      MonkCard

      Make the opponents wish they''ve never fought in the first place with this peacemaking powerhouse! With 5 Elixir, a tank is spawned, attacking through foes through melee attacks, with the third one dealing triple the damage of said attack AND pushing the victim a few tiles back.


      For 1 Elixir, you can use his Pensive Protection, an ability that makes him meditate for a 4 seconds and chill out. But not only that, a zen shield forms around himself, making him take 65% less damage! When a projectile approaches him, he''ll throw hands, nullifying AND deflecting it back to the sender, although Crown Towers take less damage from reflected projectiles. He can deflect a lot from fire to ice, and yes, he can deflect projectile SPELLS back to Crown Towers, which includes Rockets. It can deflect as long as it is travelling in the air with velocity not too high, meaning it cannot deflect stuff like Inferno Beams, stunning electricity, or a sword.'
