Skeleton King:
  champion_ability:
    name: Soul Summoning
    cost: 2
    description: 'For 2 Elixir, you can use his Soul Summoning ability right above your hand. It will release all of the souls he kept for battle in form of Skeletons around a royal Graveyard aura around him, and adds in 6 more Skeletons among the skeleton squad! Be a bit cautious, as some splash damage dealers will shrug off his reincarnated henchmen and kill a royal entity not even he could revive.


      Boss Bandit

      BossBanditCard

      The boss of the secret Forest Gang association, and the one on all the wanted posters. For 6 Elixir, the Boss Bandit is far more powerful than the Bandit, with far more dangerous and damaging hits and dashes, while making her harder to take out.


      For 1 Elixir, you can use her Getaway Grenade, which makes her become invisible while teleporting back 6 tiles, making her dash again if her target stays away! The ability has a total of 2 uses (with a 3 second cooldown between each use), building her a great getaway (and grenade) plan!


      Archer Queen

      ArcherQueenCard

      The queen and coach of all Archers. A powerful glass cannon rocks the Arena with her crossbow and its mean bolts that she constantly fires slowly for 5 Elixir.


      For 1 Elixir, you can use her Cloaking Cape ability, mitigating the glass part of her by turning herself invisible, just like the Royal Ghost: unable to be targeted for 3.5 seconds! For the cherry on top, she also increases her fire output for herself drastically while under her invisibility cape, dishing out more impressive loads of damage onto her foes while still being safe inside her hidden cloak! She''s vulnerable to heavy spells and large swarms, and walks slower under her maybe heavy cape, because with great power comes great responsibility.


      Mighty Miner

      MightyMinerCard

      You don''t need a shovel to mine skillfully! One big, strong, drilling, punch-packing hunk is spawned for 4 Elixir! He packs high health, weak damage that ramps up over time to significant measures, similar to the Inferno Dragon. He can easily melt large, tanky troops (or your tower) with just a drill, but struggles with swarms! But wait, there''s more!


      For 1 Elixir, you can use his Explosive Escape ability, which makes him drill underground and cross over to his other side, parallel to the tile he was in! Now here comes the "Explosive" part of it: when burying himself, he will leave a big bomb that explodes after one second, dealing moderate damage to troops, annihilating swarms, and pushing back lighter units! So when you face this mega mine muncher, prepare for climax, and expect the unexpected!


