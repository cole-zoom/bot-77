Bats:
  evo:
    cycles: 2
    stat_boost: +50% Hitpoints
    ability_name: Life Leech
    ability_description: Every time the Bats attack, they'll start healing at a rate of 2 pulses every second. This heal goes beyond their health bar and acts as an overheal, doubling their max health.
Battle Ram:
  evo:
    cycles: 2
    stat_boost: null
    ability_name: Head-First Ram
    ability_description: Once the Battle Ram starts charging, anything that comes in contact with it will be hit with moderate damage while small to medium troops will be knocked back 2 tiles. Additionally, upon connecting with its target, the Battle Ram will knock itself back and deal double of its regular connection damage, constantly ramming into its target until either the Battle Ram or its target is destroyed. This will deal the same double damage for every connection made. Once the Battle Ram breaks, 2 Evolved Barbarians will be revealed from underneath.
Berserker:
  hero_ability:
    name: Savage Survival
    cost: 3
    description: A Bear spirit emerges through her, making her attacks go rapid and preventing her health from going below 1 HP while dealing reduced damage to Crown Towers.
Bomber:
  evo:
    cycles: 2
    stat_boost: null
    ability_name: Bomb Bounce
    ability_description: Every time the Bomber attacks, the bomb he throws bounces twice after the initial attack. Each damage radius is 2.5 tiles apart. The bomb cannot hit the same troop more than once.
Boss Bandit:
  champion_ability:
    name: Getaway Grenade
    cost: 1
    description: 'For 1 Elixir, you can use her Getaway Grenade, which makes her become invisible while teleporting back 6 tiles, making her dash again if her target stays away! The ability has a total of 2 uses (with a 3 second cooldown between each use), building her a great getaway (and grenade) plan!


