[project]
name = "bot77"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "clash-royale-env",
    "fastapi>=0.156.4",
    "lancedb>=0.39.0",
    "numpy>=2.5.3",
    "ocrmac>=1.0.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.160",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
bot77 = "bot77:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cmake>=4.4.4",
    "ninja>=1.13.2",
    "pytest>=9.1.1",
]

# The simulator engine (docs/simulator.md): the ClashRoyaleEnv fork, a git
# submodule, built from source by scikit-build-core on `uv sync`.
[tool.uv.sources]
clash-royale-env = { path = "third_party/clash-royale-env" }

[tool.pytest.ini_options]
testpaths = ["tests"]  # not the engine submodule's own suites (third_party/clash-royale-env)
